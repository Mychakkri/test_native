name: Build Android Native Library

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Accept Android licenses
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install NDK and CMake
        run: |
          "$SDKMANAGER" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23

          cmake --build build --config Release

      - name: Check library
        run: |
          file build/libnative_test.so

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: native-library-arm64-v8a
          path: build/libnative_test.so
