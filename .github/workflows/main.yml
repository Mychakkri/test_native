name: Build Android Native Library

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23

          cmake --build build --config Release

      - name: Check library
        run: |
          file build/libnative_test.so

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: native-library-arm64-v8a
          path: build/libnative_test.so
